<button (click)="cardClicked()" class="group text-sm">
  <img [src]="product().imgUrl" alt="White fabric pouch with white zipper, black zipper pull, and black elastic loop." class="aspect-square w-full rounded-lg bg-gray-100 object-cover group-hover:opacity-75" />
  <h3 class="mt-4 font-medium text-gray-900">{{ product().title }}</h3>
  <p class="text-gray-500 italic">"{{ product().subTitle }}"</p>
  <p class="mt-2 font-medium text-gray-900">${{ product().price }}</p>
</button>
